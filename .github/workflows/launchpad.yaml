# Debian Package Builder for Notolog Editor
# Launchpad PPA upload workflow (manual trigger)
#
# CRITICAL ARCHITECTURE NOTE:
# ===========================
# This package uses a PRE-BUILT PyInstaller binary. The workflow is:
# 1. Build PyInstaller binary (creates pyinstaller/dist/notolog)
# 2. Include binary in source package tarball
# 3. Upload source package to Launchpad
# 4. Launchpad runs debian/rules which just COPIES the pre-built binary
#
# The PyInstaller binary is NOT built on Launchpad servers - it's included
# in the source tarball and installed during package build.
#
# This workflow mirrors build.yaml as closely as possible:
# - Same version handling via env vars
# - Same Python setup
# - Same build dependencies
# - Same PIE hardening verification
# - Same SPDX compliance check
#
# Repository: https://github.com/notolog/notolog-debian
# License: MIT License
#
# SPDX-FileCopyrightText: 2025-2026 Vadim Bakhrenkov
# SPDX-License-Identifier: MIT

name: Upload to Launchpad PPA

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Application tag (e.g., v1.2.4). Leave empty for latest release."
        required: false
        default: ""
      ubuntu_series:
        description: "Ubuntu series to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all # All supported LTS releases from one source archive
          - resolute # 26.04 LTS
          - noble # 24.04 LTS
          - jammy # 22.04 LTS
      ppa_name:
        description: "PPA name (default: ppa). Check your PPA URL on Launchpad."
        required: false
        default: "ppa"
      ppa_revision:
        description: "PPA rebuild revision; start at 1 and increment after an accepted upload"
        required: true
        default: "1"
      dry_run:
        description: "Dry run - build but do not upload to PPA"
        required: false
        default: false
        type: boolean

concurrency:
  group: launchpad-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  APP_GIT_REPOSITORY: "notolog/notolog-editor"
  APP_RELEASES_URL: "https://api.github.com/repos/notolog/notolog-editor/releases"
  APP_RELEASE_COMMIT: "f956469d521990be0a8e3edcf2f0645baa737a79"
  PACKAGE_NAME: "notolog-editor"

jobs:
  upload-ppa:
    # Build on the oldest supported Ubuntu to preserve glibc compatibility.
    runs-on: ubuntu-22.04
    steps:
      - name: Install jq for JSON parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Determine package version
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
            echo "✅ Using manual version override: $VERSION"
          else
            echo "Fetching latest version from GitHub API..."
            VERSION=$(curl --fail --silent --show-error "${{ env.APP_RELEASES_URL }}/latest" \
              | jq -r '.tag_name // empty')
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "❌ ERROR: Failed to fetch version from GitHub API"
              echo "   URL: ${{ env.APP_RELEASES_URL }}/latest"
              echo "   Tip: Use version_override input parameter"
              exit 1
            fi
            echo "✅ Fetched latest version: $VERSION"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid upstream release version: $VERSION" >&2
            exit 1
          fi
          echo "Building version: $VERSION"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Checkout builder repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout project source into ./src (shallow clone)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_GIT_REPOSITORY }}
          path: src
          ref: ${{ env.APP_RELEASE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set reproducible build timestamp
        run: |
          BUILD_EPOCH=$(git -C src show -s --format=%ct HEAD)
          case "$BUILD_EPOCH" in
            ''|*[!0-9]*) echo "Invalid application commit timestamp" >&2; exit 1 ;;
          esac
          echo "SOURCE_DATE_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"

      - name: Verify application release commit
        run: |
          DEBIAN_VERSION=$(dpkg-parsechangelog --show-field Version)
          if [ "$PACKAGE_VERSION" != "v${DEBIAN_VERSION%%-*}" ]; then
            echo "Selected application release does not match the Debian package version" >&2
            exit 1
          fi
          ACTUAL_COMMIT=$(git -C src rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "$APP_RELEASE_COMMIT" ]; then
            echo "Application release commit does not match the pinned source" >&2
            exit 1
          fi
          timeout 60s git -C src fetch --no-tags --depth=1 origin "refs/tags/$PACKAGE_VERSION"
          TAG_COMMIT=$(git -C src rev-parse 'FETCH_HEAD^{commit}')
          if [ "$TAG_COMMIT" != "$APP_RELEASE_COMMIT" ]; then
            echo "Selected application release tag does not match the pinned source" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install Python dependencies
        run: |
          python3 --version
          python3 -m pip install --upgrade "pip==26.2.2"
          python3 -m pip install "reuse==6.2.0"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev debhelper devscripts lintian dput xxd libegl1 libportaudio2

      - name: Build PyInstaller binary with PIE hardening
        env:
          LLAMA_CPU_PROFILE: "runtime"
          SKIP_DEB_BUILD: "true" # We only need the binary, not the .deb
          TARGET_SERIES_OVERRIDE: "jammy"
        run: |
          cd ./pyinstaller

          # Ensure scripts are executable
          chmod +x build.sh clean-build.sh

          # Run the main build script (includes PIE hardening)
          ./build.sh

          # Verify binary was created
          if [ ! -f "dist/notolog" ]; then
            echo "❌ ERROR: PyInstaller binary not found at pyinstaller/dist/notolog"
            exit 1
          fi

          echo "✅ PyInstaller binary created successfully"
          ls -lh dist/notolog
          file dist/notolog

          # Check for missing shared libraries
          echo "Checking dependencies..."
          ldd dist/notolog | grep "not found" && {
            echo "❌ ERROR: Missing shared library dependencies"
            exit 1
          } || echo "✅ All shared libraries found"

          # DO NOT run clean-build.sh here - we need dist/notolog for source package!

      - name: Check SPDX compliance on source tree
        run: |
          reuse download --all
          reuse lint || (echo '❌ SPDX compliance failed.' && exit 1)

      - name: Import GPG key
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          # Create GPG home directory
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          # Configure gpg-agent for non-interactive use
          cat > ~/.gnupg/gpg-agent.conf << 'AGENT_CONF'
          allow-loopback-pinentry
          allow-preset-passphrase
          default-cache-ttl 7200
          max-cache-ttl 31536000
          AGENT_CONF

          cat > ~/.gnupg/gpg.conf << 'GPG_CONF'
          pinentry-mode loopback
          GPG_CONF

          chmod 600 ~/.gnupg/*.conf

          # Import the GPG key (supports both ASCII-armored and base64 formats)
          if printf '%s' "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP"; then
            # ASCII-armored format
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          else
            # Base64-encoded format
            printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          fi

          # Restart gpg-agent to apply new configuration
          gpgconf --kill gpg-agent || true
          gpg-connect-agent /bye

          # Cache passphrase for all keygrips using gpg-connect-agent
          # This is the secure method that hex-encodes the passphrase
          echo "Caching passphrase for signing..."
          HEX_PASSPHRASE=$(echo -n "$GPG_PASSPHRASE" | xxd -p -c 256 | tr -d '\n' | tr 'a-f' 'A-F')

          gpg --list-secret-keys --with-colons --with-keygrip "$GPG_KEY_ID" | \
            grep "^grp:" | cut -d: -f10 | while read -r GRIP; do
              if [ -n "$GRIP" ]; then
                echo "PRESET_PASSPHRASE $GRIP -1 $HEX_PASSPHRASE" | gpg-connect-agent > /dev/null 2>&1 && \
                  echo "  ✅ Cached keygrip: ${GRIP:0:8}..." || echo "  ⚠️ Failed: ${GRIP:0:8}..."
              fi
            done

          # Verify signing works
          echo "Testing GPG signing..."
          if echo "test" | gpg --batch --yes --pinentry-mode loopback \
            --default-key "$GPG_KEY_ID" --clearsign > /dev/null 2>&1; then
            echo "✅ GPG signing test passed"
          else
            echo "⚠️ Signing test failed, trying with passphrase..."
            echo "test" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 3 \
              --default-key "$GPG_KEY_ID" --clearsign \
              3<<< "$GPG_PASSPHRASE" > /dev/null 2>&1
            echo "✅ GPG signing test passed (with passphrase)"
          fi

          # Show key info (public only)
          echo ""
          echo "Imported key:"
          gpg --list-keys "$GPG_KEY_ID" 2>/dev/null | head -5

      - name: Select Ubuntu series
        env:
          SERIES_SELECTION: ${{ github.event.inputs.ubuntu_series }}
        run: |
          case "$SERIES_SELECTION" in
            all) SERIES_LIST="jammy noble resolute" ;;
            jammy|noble|resolute) SERIES_LIST="$SERIES_SELECTION" ;;
            *) echo "❌ Unsupported Ubuntu series: $SERIES_SELECTION" >&2; exit 1 ;;
          esac
          echo "TARGET_SERIES_LIST=$SERIES_LIST" >> "$GITHUB_ENV"
          echo "Selected Ubuntu series: $SERIES_LIST"

      - name: Build source package
        env:
          DEBSIGN_KEYID: ${{ secrets.GPG_KEY_ID }}
          DEBEMAIL: ${{ vars.DEBEMAIL }}
          DEBFULLNAME: ${{ vars.DEBFULLNAME }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          PPA_REVISION: ${{ github.event.inputs.ppa_revision }}
        run: |
          # PPA builds are currently amd64-only because this source upload carries
          # the native PyInstaller executable produced by this runner.
          BASE_CHANGELOG="$RUNNER_TEMP/notolog-changelog"
          BASE_CONTROL="$RUNNER_TEMP/notolog-control"
          PACKAGE_STAGING_DIR=$(mktemp -d "$RUNNER_TEMP/notolog-source-package.XXXXXX")
          cp debian/changelog "$BASE_CHANGELOG"
          cp debian/control "$BASE_CONTROL"

          # A non-native package needs a pristine upstream archive. Keep the
          # architecture-matched executable, but exclude local/CI build state.
          UPSTREAM_VERSION=$(dpkg-parsechangelog --show-field Version | cut -d- -f1)
          ORIG_TARBALL="$RUNNER_TEMP/notolog_${UPSTREAM_VERSION}.orig.tar.xz"
          SOURCE_BUILD_DIR=$(mktemp -d "$RUNNER_TEMP/notolog-source-build.XXXXXX")
          tar --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --pax-option=delete=atime,delete=ctime \
            --create --xz --file="$ORIG_TARBALL" \
            --exclude-vcs \
            --exclude='./.github' \
            --exclude='./build' \
            --exclude='./debian' \
            --exclude='./node_modules' \
            --exclude='./pyinstaller/build' \
            --exclude='./pyinstaller/pyi-source' \
            --exclude='./source-package' \
            --exclude='./venv' \
            --exclude='./.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .

          tar --extract --xz --file="$ORIG_TARBALL" --directory="$SOURCE_BUILD_DIR"
          cp -a debian "$SOURCE_BUILD_DIR/debian"
          if find "$SOURCE_BUILD_DIR" -type d \
            \( -name venv -o -name .venv \) -print -quit | grep -q .; then
            echo "Virtual environment found in source package staging tree" >&2
            exit 1
          fi

          : > "$PACKAGE_STAGING_DIR/versions.txt"

          case "$PPA_REVISION" in
            ''|*[!0-9]*|0) echo "Invalid PPA revision: $PPA_REVISION" >&2; exit 1 ;;
          esac

          for SERIES in $TARGET_SERIES_LIST; do
            cp "$BASE_CHANGELOG" "$SOURCE_BUILD_DIR/debian/changelog"
            cp "$BASE_CONTROL" "$SOURCE_BUILD_DIR/debian/control"
            sed -i 's/^Architecture: amd64 arm64$/Architecture: amd64/' \
              "$SOURCE_BUILD_DIR/debian/control"

            case "$SERIES" in
              jammy) SERIES_VERSION="22.04" ;;
              noble) SERIES_VERSION="24.04" ;;
              resolute) SERIES_VERSION="26.04" ;;
              *) echo "Unsupported Ubuntu series: $SERIES" >&2; exit 1 ;;
            esac
            BASE_VERSION=$(dpkg-parsechangelog \
              --file "$SOURCE_BUILD_DIR/debian/changelog" --show-field Version)
            FULL_VERSION="${BASE_VERSION}~ppa${PPA_REVISION}~ubuntu${SERIES_VERSION}.1"
            sed -i "1s/${BASE_VERSION}/${FULL_VERSION}/" \
              "$SOURCE_BUILD_DIR/debian/changelog"
            sed -i "1s/) [^;]*;/) ${SERIES};/" \
              "$SOURCE_BUILD_DIR/debian/changelog"
            echo "Building source package $FULL_VERSION for $SERIES"

            if [ "$DRY_RUN" = "true" ]; then
              (cd "$SOURCE_BUILD_DIR" && dpkg-buildpackage -S -sa -us -uc)
            else
              (cd "$SOURCE_BUILD_DIR" && \
                dpkg-buildpackage -S -sa -k"$DEBSIGN_KEYID")
              gpg --verify "$RUNNER_TEMP/notolog_${FULL_VERSION}.dsc"
              gpg --verify "$RUNNER_TEMP/notolog_${FULL_VERSION}_source.changes"
            fi

            printf '%s=%s\n' "$SERIES" "$FULL_VERSION" >> "$PACKAGE_STAGING_DIR/versions.txt"
            cp "$RUNNER_TEMP/notolog_${FULL_VERSION}.debian.tar.xz" "$PACKAGE_STAGING_DIR/"
            cp "$RUNNER_TEMP/notolog_${FULL_VERSION}.dsc" "$PACKAGE_STAGING_DIR/"
            cp "$RUNNER_TEMP/notolog_${FULL_VERSION}_source.changes" "$PACKAGE_STAGING_DIR/"
            cp "$RUNNER_TEMP/notolog_${FULL_VERSION}_source.buildinfo" "$PACKAGE_STAGING_DIR/"
          done

          cp "$ORIG_TARBALL" "$PACKAGE_STAGING_DIR/"
          mkdir source-package
          cp "$PACKAGE_STAGING_DIR"/* source-package/
          mkdir source-package/build-evidence
          cp pyinstaller/build/reports/build-requirements.txt source-package/build-evidence/
          cp pyinstaller/build/reports/dependency-licenses.md source-package/build-evidence/
          cp "pyinstaller/build/reports/notolog-${UPSTREAM_VERSION}.cdx.json" source-package/build-evidence/
          echo "Source package files created:"
          ls -lh source-package/

      - name: Verify source package contains binary
        run: |
          while IFS='=' read -r SERIES FULL_VERSION; do
            VERIFY_DIR="$RUNNER_TEMP/verify-source-$SERIES"
            dpkg-source -x "source-package/notolog_${FULL_VERSION}.dsc" "$VERIFY_DIR"
            if [ ! -f "$VERIFY_DIR/pyinstaller/dist/notolog" ]; then
              echo "❌ PyInstaller binary missing from $SERIES source package" >&2
              exit 1
            fi
            file "$VERIFY_DIR/pyinstaller/dist/notolog"
          done < source-package/versions.txt

      - name: Lint source package
        run: |
          while IFS='=' read -r SERIES FULL_VERSION; do
            echo "Linting $FULL_VERSION for $SERIES"
            lintian --fail-on error "source-package/notolog_${FULL_VERSION}.dsc"
          done < source-package/versions.txt

      - name: Configure dput
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          PPA_NAME: ${{ github.event.inputs.ppa_name }}
          LP_USERNAME: ${{ secrets.LP_USERNAME }}
        run: |
          if [[ ! "$PPA_NAME" =~ ^[a-z0-9][a-z0-9+.-]*$ ]]; then
            echo "Invalid PPA name" >&2
            exit 1
          fi
          if [[ ! "$LP_USERNAME" =~ ^[a-z0-9][a-z0-9+.-]*$ ]]; then
            echo "Invalid Launchpad username" >&2
            exit 1
          fi
          # PPA path format: ~USERNAME/PPA_NAME/ubuntu/
          # Default PPA name on Launchpad is 'ppa', not the project name
          # Check your PPA URL: https://launchpad.net/~USERNAME/+archive/ubuntu/PPA_NAME
          cat > ~/.dput.cf << EOF
          [notolog-ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~$LP_USERNAME/$PPA_NAME/ubuntu/
          login = anonymous
          allow_unsigned_uploads = 0
          EOF
          echo "dput configuration created"

      - name: Upload to PPA
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          LP_USERNAME: ${{ secrets.LP_USERNAME }}
          PPA_NAME: ${{ github.event.inputs.ppa_name }}
        run: |
          while IFS='=' read -r SERIES FULL_VERSION; do
            echo "Uploading $FULL_VERSION to $SERIES..."
            dput notolog-ppa "source-package/notolog_${FULL_VERSION}_source.changes"
          done < source-package/versions.txt
          echo ""
          echo "✅ Upload complete!"
          echo ""
          echo "Check Launchpad for the acceptance status and published builds."

      - name: Skip upload (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🔍 DRY RUN - Skipping PPA upload"
          echo "Source package was built successfully but not uploaded."
          ls -lh source-package/

      - name: Upload source artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-package-${{ env.PACKAGE_VERSION }}
          path: source-package/
          if-no-files-found: error

      - name: Validate changelog
        run: dpkg-parsechangelog
