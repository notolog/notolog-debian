# Debian Package Builder for Notolog Editor
# Linting workflow for Notolog Debian Package Builder
#
# Repository: https://github.com/notolog/notolog-debian
# License: MIT License
#
# SPDX-FileCopyrightText: 2025-2026 Vadim Bakhrenkov
# SPDX-License-Identifier: MIT

name: Lint

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install linting tools
        run: |
          python -m pip install "reuse==6.2.0"

      - name: Check SPDX compliance
        run: |
          reuse download --all
          reuse lint

      - name: Validate debian/changelog
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          dpkg-parsechangelog

      - name: Test bundle audit
        run: python -m unittest discover -s pyinstaller/tests -v

      - name: Test PPA upload handling
        run: python -m unittest discover -s .github/tests -v

      - name: Shellcheck scripts
        run: |
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -type f -print0 | xargs -0 shellcheck --severity=warning
