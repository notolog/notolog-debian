# Debian Package Builder for Notolog Editor
# Build scripts and packaging for the Notolog Editor Debian release.
#
# Repository: https://github.com/notolog/notolog-debian
# License: MIT License
#
# SPDX-FileCopyrightText: 2025-2026 Vadim Bakhrenkov
# SPDX-License-Identifier: MIT

name: Build Debian Package

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version override (e.g., v1.2.4). Leave empty for latest release."
        required: false
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_GIT_REPOSITORY: "notolog/notolog-editor"
  APP_RELEASES_URL: "https://api.github.com/repos/notolog/notolog-editor/releases"
  APP_RELEASE_COMMIT: "f956469d521990be0a8e3edcf2f0645baa737a79"
  PACKAGE_NAME: "notolog-editor"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
            target_series: jammy
          - runner: ubuntu-24.04-arm
            architecture: arm64
            target_series: noble
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Install release metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Determine package version
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=$(curl --fail --silent --show-error "${{ env.APP_RELEASES_URL }}/latest" \
              | jq -r '.tag_name // empty')
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+ubuntu[0-9]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "Building version: $VERSION"

          # Extract upstream version (strip Debian revision suffix like -1ubuntu1)
          # Example: v1.2.0-1ubuntu1 -> v1.2.0
          UPSTREAM_VERSION="${VERSION%%-*}"
          echo "Upstream version: $UPSTREAM_VERSION"

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_ENV"

      - name: Checkout builder repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout project source into ./src (shallow clone)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_GIT_REPOSITORY }}
          path: src
          ref: ${{ env.APP_RELEASE_COMMIT }}
          fetch-depth: 1 # Fetch only the pinned commit.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Verify application release commit
        run: |
          DEBIAN_VERSION=$(dpkg-parsechangelog --show-field Version)
          if [ "$UPSTREAM_VERSION" != "v${DEBIAN_VERSION%%-*}" ]; then
            echo "Selected application release does not match the Debian package version" >&2
            exit 1
          fi
          ACTUAL_COMMIT=$(git -C src rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "$APP_RELEASE_COMMIT" ]; then
            echo "Application release commit does not match the pinned source" >&2
            exit 1
          fi
          timeout 60s git -C src fetch --no-tags --depth=1 origin "refs/tags/$UPSTREAM_VERSION"
          TAG_COMMIT=$(git -C src rev-parse 'FETCH_HEAD^{commit}')
          if [ "$TAG_COMMIT" != "$APP_RELEASE_COMMIT" ]; then
            echo "Selected application release tag does not match the pinned source" >&2
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python3 --version
          python3 -m pip install --upgrade "pip==26.2.2"
          python3 -m pip install "reuse==6.2.0"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev debhelper devscripts lintian libegl1 libportaudio2

      - name: Validate builder release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUILDER_TAG: ${{ github.ref_name }}
        run: |
          DEBIAN_VERSION=$(dpkg-parsechangelog --show-field Version)
          if [ "$BUILDER_TAG" != "v$DEBIAN_VERSION" ]; then
            echo "Builder tag $BUILDER_TAG does not match Debian version $DEBIAN_VERSION" >&2
            exit 1
          fi

      - name: Build Debian package
        env:
          TARGET_SERIES_OVERRIDE: ${{ matrix.target_series }}
        run: |
          cd ./pyinstaller

          # Ensure scripts are executable
          chmod +x build.sh clean-build.sh

          # Run the main build script
          ./build.sh

      - name: Check SPDX compliance on source tree
        run: |
          reuse download --all
          reuse lint || (echo '❌ SPDX compliance failed.' && exit 1)

      - name: Copy .deb, .buildinfo, and .changes files
        run: |
          cd ..

          DEST="${{ github.workspace }}/build/debian"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          shopt -s nullglob
          PACKAGES=(notolog_*.deb)
          if (( ${#PACKAGES[@]} != 1 )); then
            echo "❌ Expected exactly one .deb, found ${#PACKAGES[@]}."
            exit 1
          fi
          PACKAGE_ARCHITECTURE=$(dpkg-deb --field "${PACKAGES[0]}" Architecture)
          if [ "$PACKAGE_ARCHITECTURE" != "${{ matrix.architecture }}" ]; then
            echo "❌ Expected ${{ matrix.architecture }}, built $PACKAGE_ARCHITECTURE."
            exit 1
          fi
          cp "${PACKAGES[0]}" "$DEST/"

          for EXTENSION in buildinfo changes; do
            FILES=(notolog_*."$EXTENSION")
            if (( ${#FILES[@]} != 1 )); then
              echo "❌ Expected exactly one .$EXTENSION file, found ${#FILES[@]}."
              exit 1
            fi
            cp "${FILES[0]}" "$DEST/"
          done

          lintian --fail-on error "$DEST/${PACKAGES[0]}"
          dpkg-deb --info "$DEST/${PACKAGES[0]}"
          cp "${{ github.workspace }}/pyinstaller/build/reports/build-requirements.txt" "$DEST/"
          cp "${{ github.workspace }}/pyinstaller/build/reports/dependency-licenses.md" "$DEST/"
          cp "${{ github.workspace }}/pyinstaller/build/reports/notolog-${UPSTREAM_VERSION#v}.cdx.json" "$DEST/"
          echo "📦 Final artifact contents:"
          ls -lh "$DEST"

          "${{ github.workspace }}/pyinstaller/clean-build.sh"

      - name: Validate changelog
        run: dpkg-parsechangelog

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notolog-${{ env.PACKAGE_VERSION }}-${{ matrix.architecture }}
          path: build/debian/*
          if-no-files-found: error
